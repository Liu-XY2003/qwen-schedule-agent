name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------- 静态检查
  hygiene:
    name: 仓库卫生 (BOM / 敏感信息 / 主题漂移)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 所有 .ps1 必须带 UTF-8 BOM
        run: |
          # PowerShell 5.1 读无 BOM 的 UTF-8 文件会按 GBK 解析, 中文字符串直接崩。
          # 这个坑很隐蔽 —— 脚本在 pwsh 7 下测试是好的, 一到计划任务就静默退出。
          fail=0
          while IFS= read -r f; do
            head -c3 "$f" | od -An -tx1 | grep -q 'ef bb bf' || { echo "缺少 BOM: $f"; fail=1; }
          done < <(find . -name '*.ps1' -not -path './.git/*')
          exit $fail

      - name: 主题生成物与 tokens.json 一致
        run: python theme/gen_theme.py --check

      - name: 敏感信息审计
        shell: pwsh
        run: ./scripts/audit_secrets.ps1

      # 与上面的 audit_secrets 互补: 那个查"你自己"的服务器地址和密钥,
      # 这个查"能定位到具体的人"的信息（邮箱/手机/姓名/学号/本机用户名）。
      # 赛事普遍要求匿名评审, 材料里出现校名姓名会被判违规。
      - name: 个人信息审计（匿名评审要求）
        run: python scripts/privacy_audit.py

  # ---------------------------------------------------------------- 单元测试
  test:
    name: 单元测试 (不需要模型)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r bridge/requirements.txt

      - name: 日期解析 (确定性的, 不依赖模型)
        working-directory: bridge
        run: python test_date_parsing.py

      - name: 周/月偏移
        working-directory: bridge
        run: python test_offsets.py

      - name: 契约无漂移 (Pydantic 镜像 vs JSON Schema)
        working-directory: bridge
        run: python schema_models.py ../schema/schedule_command.v2.json

      - name: 主题一致性 (两端 + CSS 变量)
        working-directory: bridge
        run: python test_theme_consistency.py

  # ---------------------------------------------------------------- 规划求解器
  planner:
    name: 规划求解器 (CP-SAT)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 求解器是二阶段"确定性"的那一半, 不依赖模型, 可以完整地在 CI 里跑。
      # 本地建议用独立 venv（见 bridge/requirements-planner.txt），CI 是干净环境, 直接装即可。
      - name: 安装 OR-Tools
        run: pip install -r bridge/requirements-planner.txt

      - name: 规划器性质测试
        working-directory: bridge
        run: python test_planner.py

      - name: 规划层日期解析（确定性, 不依赖模型）
        working-directory: bridge
        run: python test_planning_dates.py

      - name: 演示跑一遍（确认能出计划）
        working-directory: bridge
        run: python planner.py

  # ---------------------------------------------------------------- 规划训练数据
  # 训练本身要 GPU, CI 里跑不了; 但**数据集正确性**可以, 而且必须 ——
  # 反向构造的全部价值就建立在"标签一定对"之上。
  planning-data:
    name: 规划训练数据（标签正确性）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 训练用 SYS 与推理用 SYS 一致
        working-directory: pod
        run: python test_sys_consistency.py

      - name: 校验器自测（证明它能抓到错误、也不误报）
        working-directory: pod
        run: python test_verify_catches_errors.py

      - name: 生成数据集并校验标签
        working-directory: pod
        run: |
          python gen_planning_dataset.py --train 2000 --test 200 --outdir /tmp/plandata
          python verify_planning_dataset.py /tmp/plandata/train.jsonl
          python verify_planning_dataset.py /tmp/plandata/test.jsonl

  # ---------------------------------------------------------------- 访问控制
  auth:
    name: 访问控制 (起真实服务)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r bridge/requirements.txt

      - name: 令牌门禁 12 项
        working-directory: bridge
        # test_auth.py 自己起两个临时实例 (不带令牌 / 带令牌), 不需要推理后端
        run: python test_auth.py

  # ---------------------------------------------------------------- 数据集
  dataset:
    name: 数据集符合 schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install jsonschema

      - name: 生成一小批数据并校验 100% 合规
        run: |
          # 数据集有 4000+ 条, 全量生成太慢; CI 只跑一个可复现的子集,
          # 断言"生成器产出的标签 100% 符合 schema"这个性质本身。
          python pod/gen_dataset.py --train 150 --test 50 --outdir /tmp/ci-data
          python - <<'PY'
          import json, glob, sys
          from jsonschema import Draft202012Validator
          schema = json.load(open("schema/schedule_command.v2.json", encoding="utf-8"))
          v = Draft202012Validator(schema)
          bad = tot = 0
          for path in sorted(glob.glob("/tmp/ci-data/*")):
              for line in open(path, encoding="utf-8"):
                  if not line.strip():
                      continue
                  ex = json.loads(line)
                  content = [m for m in ex["messages"] if m["role"] == "assistant"][-1]["content"]
                  errs = list(v.iter_errors(json.loads(content)))
                  tot += 1
                  if errs:
                      bad += 1
                      if bad <= 3:
                          print("不合规:", errs[0].message)
          print(f"校验 {tot} 条, 不合规 {bad} 条")
          sys.exit(1 if bad else 0)
          PY
